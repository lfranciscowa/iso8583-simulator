<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO 8583 Simulator — Login</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --acc:#6366f1; --txt:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--txt); }
  .card { background:var(--card); padding:32px; border-radius:12px; width:320px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:10px; margin-bottom:14px; border:1px solid #334155; border-radius:8px;
          background:#0f172a; color:var(--txt); font-size:14px; }
  input:focus { outline:2px solid var(--acc); }
  button { width:100%; padding:11px; border:none; border-radius:8px; background:var(--acc); color:#fff;
           font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { background:#4f46e5; }
  .err { color:#f87171; font-size:13px; margin:8px 0 0; min-height:18px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>🔐 ISO 8583 Simulator</h1>
    <p class="sub">Inicia sesión para continuar</p>
    <label for="user">Usuario</label>
    <input id="user" name="user" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
<script>
(async () => {
  // si el login está deshabilitado o ya hay sesión, ir directo al simulador
  const s = await fetch('/api/session').then(r => r.json()).catch(() => ({ enabled:false, authenticated:true }));
  if (!s.enabled || s.authenticated) location.href = '/';
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = document.getElementById('user').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ user, password }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) { errEl.textContent = d.error || 'Error al iniciar sesión'; return; }
    location.href = '/';
  } catch (err) {
    errEl.textContent = 'No se pudo conectar con el servidor';
  }
});
</script>
</body>
</html>
