# Render Blueprint — Simulador ISO 8583
# Web Service Node. Expone la UI web y el endpoint /api/pos-tcp por el que el
# POS (Visual Admin) le manda las tramas vía HTTPS.
#
# NOTA: el listener TCP crudo (puerto 8583) NO es accesible públicamente en
# Render; el POS le habla por /api/pos-tcp. El AS/400 real, cuando se conecte,
# necesitará red privada/VPN o un host con TCP expuesto.
services:
  - type: web
    name: iso8583-simulator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # Dominio propio. Render emite el certificado TLS automáticamente una vez
    # que los registros DNS apuntan correctamente (ver DEPLOY-RENDER.md).
    domains:
      - simulador.tesh-desarrollo.com
    envVars:
      # Validación de PIN (DE52). Por defecto valida contra 1234 con tpk-demo.
      - key: SIM_PIN_VALIDATE
        value: "true"
      - key: SIM_PIN_EXPECTED
        value: "1234"
      # Producción: cookies Secure + cabeceras HSTS.
      - key: NODE_ENV
        value: production
      - key: SIM_SECURE_COOKIES
        value: "true"
      # Llave maestra y API key del bridge: definir en el dashboard (secretas).
      - key: SIM_MASTER_KEY
        sync: false
      - key: SIM_BRIDGE_API_KEY
        sync: false
      # Login de la UI/API. El login SOLO se activa si SIM_ADMIN_PASS tiene
      # valor; si se omite, la app queda en modo abierto (sin login).
      # Define ambas en el dashboard (no las pongas en texto plano en el repo).
      - key: SIM_ADMIN_USER
        sync: false
      - key: SIM_ADMIN_PASS
        sync: false
